[project]
name = "neograph"
version = "0.8.0"
description = "Write Python. Get a production LLM graph. Declarative LLM graph compiler that compiles @node-decorated functions into LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Konstantin Mirin", email = "konstantin@mirin.pro"},
]
keywords = ["llm", "langgraph", "declarative", "typed", "pipeline", "graph", "compiler", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "langgraph>=1.1,<2.0",
    "langgraph-checkpoint>=4.0,<5.0",
    "langchain-core>=1.2,<2.0",
    "structlog>=23.0",
    "jsonschema>=4.26.0",
    "json-repair>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# >=3.11: first version whose langchain CallbackHandler accepts
# trace_context=, which neograph-s65y2 uses to pin the trace id to a
# value derived from the run id (measured by bisect; 3.10 takes only
# public_key). create_trace_id(seed=) exists from 3.0 and is stable.
langfuse = ["langfuse>=3.11"]
# neograph-xdt2: the optional consumer-side MCP client DX battery ships as a
# SECOND top-level package (src/neograph_mcp) — graduating the client stitching
# the g4q9 examples hand-roll into a shipped, overridable helper. Same deps/pin as
# the mcp-examples extra below; src/neograph itself stays MCP-free (the
# no-session-ownership guard scans src/neograph only). Importing neograph_mcp
# without this extra fails loud with an install hint. Run its tests with:
#   uv run --extra mcp pytest tests/test_mcp_battery.py
mcp = [
    "langchain-mcp-adapters>=0.3",
    # <2 pin: mcp 2.0 renames FastMCP -> MCPServer; langchain-mcp-adapters 0.3.x
    # targets the mcp 1.x API (matches the mcp-examples pin).
    "mcp>=1.28,<2",
]
# neograph-g4q9: MCP examples (23/24) exercise the REAL Model Context Protocol
# over stdio against examples/_mcp_demo_server.py. NOT core deps — src/neograph
# stays MCP-free (the no-session-ownership guard scans src/ only; consumer-side
# client stitching is itself the demo's thesis). Run with:
#   uv run --extra mcp-examples pytest tests/test_mcp_examples_e2e.py
mcp-examples = [
    "langchain-mcp-adapters>=0.3",
    # <2 pin: mcp 2.0 renames FastMCP -> MCPServer; the demo server and
    # langchain-mcp-adapters 0.3.x both target the mcp 1.x FastMCP import.
    "mcp>=1.28,<2",
]
# neograph-x75es: there is deliberately NO `dev` extra. The dev toolchain lives in
# [dependency-groups].dev — the ONE group `uv run pytest` installs — because having
# both a `dev` extra and a `dev` group is what stranded pytest-asyncio (and
# pyagentspec) outside the project's own gate. One namespace, one source of truth.
# The identical disease recurred independently on main, which branched before this
# fix landed — see neograph-4n48u, ported back here as a no-op (this file already
# has the fix).
# neograph-nkjv9: Agent Spec Property<->spec_types type-registry bridge.
# CONSUMER-facing optional extra — src/neograph stays Agent-Spec-free by default
# (imports of pyagentspec in spec_types.py / _agent_spec.py are function-local and
# import-guarded, pinned by tests/test_guards_agent_spec_core_purity.py). The TEST
# gate gets pyagentspec from [dependency-groups].dev instead; see the note there.
agent-spec = [
    "pyagentspec>=26.1.0,<27",
]

[project.scripts]
neograph = "neograph.__main__:main"

[project.urls]
Homepage = "https://neograph.pro"
Documentation = "https://neograph.pro"
Repository = "https://github.com/KonstantinMirin/neograph"
Issues = "https://github.com/KonstantinMirin/neograph/issues"
Changelog = "https://github.com/KonstantinMirin/neograph/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# neograph-xdt2: two top-level packages in one distribution. src/neograph_mcp is
# the OPTIONAL [mcp] battery; it imports langchain-mcp-adapters but nothing from
# the langgraph engine or neograph run-layer internals, so src/neograph stays
# trivially MCP-free (the no-session-ownership guard scans src/neograph only).
packages = ["src/neograph", "src/neograph_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/neograph",
    "src/neograph_mcp",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "tests",
    "examples",
    "website",
    ".claude",
    ".beads",
    "docs",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-level import not at top (deferred imports for circular dep avoidance)
    "E741",   # ambiguous variable name (n, l are conventional in this codebase)
    "F841",   # local variable assigned but never used (common in side-effect tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]  # assert False is used in structural guards
"src/neograph/__init__.py" = ["F401"]  # re-exports

[tool.ruff.lint.isort]
known-first-party = ["neograph"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# neograph-w74k.1 (Phase 0): async collection for the dual-surface harness.
# 'auto' treats bare `async def test_*` as asyncio without per-test markers
# (safe: zero existing async tests, so nothing is reclassified). The explicit
# fixture loop scope silences the pytest-asyncio deprecation warning and avoids
# a future warnings-as-error surprise.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# neograph-e8wiv: an empty parametrize is a COLLECTION ERROR, never a skip.
# pytest's default turns `@pytest.mark.parametrize(..., <empty>)` into a skipped
# test with reason "got empty parameter set for (...)" -- and a skip is invisible
# in a pass count, which is exactly what scripts/check_skips.py exists to refuse.
# Worse, that skip is indistinguishable from a test that failed to run for a real
# reason. 'fail_at_collect' makes the condition loud at collection, in EVERY
# pytest invocation including `make quality`, rather than at the release gate.
# An invariant that a set is empty must be written as an assertion on the set,
# not encoded in the absence of parameters. Pinned by
# tests/test_guards_empty_parametrize.py.
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    "ignore:Node '.*'.*single-type inputs:DeprecationWarning",
]
markers = [
    "perf: marks async/sync per-node overhead perf gates (neograph-w74k.2.6 Phase 1f)",
    # Talks to a REAL external service. Deselected from the default suite by the
    # Makefile's `test` target (-m "not live") so the dev loop stays offline,
    # fast and deterministic — otherwise these run whenever LANGFUSE_* happen to
    # be exported, making `make quality` network-bound. Run via `make live` or
    # `make release-gate`.
    "live: marks tests that require real external credentials and network",
]

[dependency-groups]
# THE gate group. `uv run pytest` / `uv sync` install exactly this (plus
# [project].dependencies) — extras need an explicit `--extra` and are therefore
# invisible to `make quality`. Every dependency the quality gate needs belongs
# HERE, not in [project.optional-dependencies]; see neograph-x75es, where a dep
# in the wrong namespace hid 271 tests and broke the gate outright (the same
# disease recurred independently on main as neograph-4n48u, ported back as a
# no-op).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "hypothesis>=6.151.12",
    "langchain>=1.0",
    "langchain-openai>=1.2.2",
    "langfuse>=3.11",
    # neograph-w74k.2.5 (Phase 1e): file-backed Sqlite savers for the async
    # checkpointer + mixed-driver resume + crash-recovery E2Es. In the default
    # dependency-group (installed by `uv sync` / `uv run pytest`) — NOT an
    # optional extra — so the async checkpoint test file collects. Dev-only:
    # neograph core stays sqlite-free.
    "langgraph-checkpoint-sqlite>=3.1",
    # neograph-3my4x (verifiable-docs Stage D): docs-snippet execution harness.
    # tests/test_docs_snippets.py couples to the PRIVATE pre-1.0
    # pytest_examples.find_examples._extract_code_chunks; the upper bound guards
    # against a 0.1.x minor renaming that symbol (mirrors the mcp>=1.28,<2 pin).
    # In [dependency-groups].dev (auto-installed by `uv run pytest`), so the file
    # collects under the bare test command.
    "pytest-examples>=0.0.18,<0.1",
    "pytest-cov>=7.1.0",
    # neograph-x75es: the Agent Spec proof surface — 271 tests across 13 files
    # gated on `pytest.importorskip("pyagentspec")`. Here, NOT only in the
    # [agent-spec] extra, so those files collect under the bare test command;
    # while the dep sat in the extra alone the gate silently ran none of them and
    # 32 more hard-failed. The [agent-spec] extra stays as the CONSUMER-facing
    # optional dep — this is a test-gate placement, not a packaging change, and
    # core stays Agent-Spec-free per tests/test_guards_agent_spec_core_purity.py.
    "pyagentspec>=26.1.0,<27",
    # neograph-x75es: the gate's own toolchain. These previously lived ONLY in a
    # `dev` EXTRA, which `uv run pytest` does not install — so on a clean checkout
    # `make quality` failed 51 async tests (asyncio_mode = "auto" with no plugin to
    # drive it), and pytest/ruff were present only by accident, pulled in
    # transitively by pytest-cov / pytest-examples. A gate whose own runner is a
    # transitive accident is not a gate.
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "python-dotenv>=1.2.2",
]
